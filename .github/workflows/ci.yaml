name: feature-install CI

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq curl tar

      - name: Test
        run: bats test/feature-install.bats
